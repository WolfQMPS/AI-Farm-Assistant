<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Learning / Aprendizaje de Granja</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #1a3a2a;
    --green-mid: #2d6a4f;
    --green-light: #52b788;
    --green-pale: #d8f3dc;
    --cream: #f8f4ee;
    --cream-dark: #ede8df;
    --amber: #e9a84c;
    --amber-light: #fdf0d5;
    --text-dark: #1a2016;
    --text-mid: #3d5a40;
    --text-muted: #7a8c6e;
    --white: #ffffff;
    --card-radius: 20px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    background-image: radial-gradient(circle at 20% 20%, rgba(82,183,136,0.08) 0%, transparent 50%),
                      radial-gradient(circle at 80% 80%, rgba(233,168,76,0.06) 0%, transparent 50%);
  }

  /* ── HEADER ── */
  header {
    background: var(--green-deep);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--green-light);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg { width: 20px; height: 20px; fill: var(--green-deep); }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
  }

  .logo-text span {
    display: block;
    font-size: 0.7rem;
    font-weight: 400;
    color: var(--green-light);
    letter-spacing: 0.05em;
  }

  .lang-toggle {
    display: flex;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    overflow: hidden;
  }

  .lang-btn {
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    color: rgba(255,255,255,0.6);
    border: none;
    background: transparent;
    cursor: pointer;
    transition: var(--transition);
    letter-spacing: 0.03em;
  }

  .lang-btn.active {
    background: var(--green-light);
    color: var(--green-deep);
  }

  /* ── HERO ── */
  .hero {
    padding: 2.5rem 2rem 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700;
    color: var(--green-deep);
    line-height: 1.15;
    margin-bottom: 0.5rem;
  }

  .hero p {
    font-size: 0.95rem;
    color: var(--text-muted);
    font-weight: 300;
  }

  /* ── FILTERS ── */
  .filters {
    padding: 0 2rem 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-right: 4px;
  }

  .filter-pill {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    border: 1.5px solid var(--cream-dark);
    background: var(--white);
    color: var(--text-mid);
    cursor: pointer;
    transition: var(--transition);
  }

  .filter-pill:hover { border-color: var(--green-light); color: var(--green-mid); }
  .filter-pill.active {
    background: var(--green-mid);
    border-color: var(--green-mid);
    color: var(--white);
  }

  /* ── CARD GRID ── */
  .card-grid {
    padding: 0 2rem 3rem;
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  /* ── LEARNING CARD ── */
  .card {
    background: var(--white);
    border-radius: var(--card-radius);
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.06);
    transition: var(--transition);
    cursor: pointer;
    animation: fadeUp 0.4s ease both;
  }

  .card:hover { transform: translateY(-4px); border-color: var(--green-light); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-image {
    width: 100%;
    aspect-ratio: 16/10;
    object-fit: cover;
    display: block;
    background: var(--green-pale);
  }

  .card-image-placeholder {
    width: 100%;
    aspect-ratio: 16/10;
    background: linear-gradient(135deg, var(--green-pale) 0%, var(--cream-dark) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-image-placeholder svg {
    width: 48px;
    height: 48px;
    opacity: 0.3;
    fill: var(--green-mid);
  }

  .card-body { padding: 1.25rem; }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .card-category {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--green-mid);
    background: var(--green-pale);
    padding: 3px 10px;
    border-radius: 20px;
  }

  .card-date {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 300;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-dark);
    margin-bottom: 8px;
    line-height: 1.35;
  }

  .card-annotation {
    font-size: 0.875rem;
    color: var(--text-muted);
    line-height: 1.6;
    font-weight: 300;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    padding: 0.875rem 1.25rem;
    border-top: 1px solid var(--cream-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .educator-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .educator-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--amber-light);
    color: var(--amber);
    font-size: 10px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .audio-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--amber-light);
    border: 1.5px solid var(--amber);
    color: #9a6e1a;
    font-size: 12px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: var(--transition);
  }

  .audio-btn:hover { background: var(--amber); color: var(--white); }
  .audio-btn.playing { background: var(--amber); color: var(--white); }

  .audio-btn svg { width: 14px; height: 14px; }

  /* ── MODAL ── */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,58,42,0.6);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--white);
    border-radius: var(--card-radius);
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    overflow-y: auto;
    animation: modalIn 0.25s cubic-bezier(0.4,0,0.2,1);
  }

  @keyframes modalIn {
    from { opacity:0; transform: scale(0.95) translateY(10px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }

  .modal-image {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: var(--card-radius) var(--card-radius) 0 0;
    background: var(--green-pale);
  }

  .modal-image-placeholder {
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--green-pale);
    border-radius: var(--card-radius) var(--card-radius) 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-image-placeholder svg { width: 64px; height: 64px; fill: var(--green-mid); opacity: 0.25; }

  .modal-content { padding: 1.5rem; }

  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-dark);
    line-height: 1.25;
  }

  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--cream-dark);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: var(--transition);
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1;
  }

  .modal-close:hover { background: var(--cream-dark); color: var(--text-dark); }

  .modal-category-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1rem;
    align-items: center;
  }

  .modal-annotation {
    font-size: 0.95rem;
    color: var(--text-mid);
    line-height: 1.7;
    font-weight: 300;
    margin-bottom: 1.25rem;
  }

  .modal-audio {
    background: var(--cream);
    border-radius: 12px;
    padding: 1rem;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1rem;
  }

  .modal-audio-play {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--green-mid);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: var(--transition);
  }

  .modal-audio-play:hover { background: var(--green-deep); }
  .modal-audio-play svg { width: 16px; height: 16px; fill: var(--white); margin-left: 2px; }
  .modal-audio-play.playing svg { margin-left: 0; }

  .modal-audio-info { flex: 1; }
  .modal-audio-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .modal-audio-bar {
    height: 4px;
    background: var(--cream-dark);
    border-radius: 2px;
    overflow: hidden;
  }

  .modal-audio-progress {
    height: 100%;
    background: var(--green-light);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
  }

  .modal-footer-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    padding-top: 1rem;
    border-top: 1px solid var(--cream-dark);
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
  }

  .empty-state svg { width: 48px; height: 48px; fill: var(--cream-dark); margin-bottom: 1rem; }
  .empty-state h3 { font-family: 'Syne', sans-serif; font-size: 1.1rem; color: var(--text-mid); margin-bottom: 0.5rem; }
  .empty-state p { font-size: 0.875rem; font-weight: 300; }

  /* ── AIRTABLE CONFIG BANNER ── */
  .config-banner {
    background: var(--amber-light);
    border-bottom: 1.5px solid var(--amber);
    padding: 0.75rem 2rem;
    font-size: 13px;
    color: #7a5010;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .config-banner a { color: #9a6e1a; font-weight: 500; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: 1rem; }
    .hero, .filters, .card-grid { padding-left: 1rem; padding-right: 1rem; }
    .card-grid { grid-template-columns: 1fr; gap: 14px; }
    .hero { padding-top: 1.5rem; }
  }
</style>
</head>
<body>

<!-- Config banner — remove once Airtable is connected -->
<div class="config-banner">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  Demo mode — sample cards shown. To connect Airtable, add your API key and base ID in the <code style="background:rgba(0,0,0,0.08);padding:1px 5px;border-radius:4px">CONFIG</code> section of the JS below.
</div>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/><path d="M17 3.34A9.99 9.99 0 0 1 22 12c0 5.52-4.48 10-10 10S2 17.52 2 12c0-3.15 1.46-5.97 3.75-7.83L7 5.5C5.17 7.07 4 9.4 4 12c0 4.42 3.58 8 8 8s8-3.58 8-8c0-2.6-1.24-4.91-3.17-6.42L17 3.34z"/></svg>
    </div>
    <div class="logo-text">
      <span data-en="Farm Learning" data-es="Aprendizaje de Granja">Farm Learning</span>
      <span data-en="Milker Training Programme" data-es="Programa de Capacitación">Milker Training Programme</span>
    </div>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('es')">ES</button>
  </div>
</header>

<div class="hero">
  <h1 data-en="Learning Cards" data-es="Tarjetas de Aprendizaje">Learning Cards</h1>
  <p data-en="Browse lessons shared by your educators. Tap a card to read and listen." data-es="Explora las lecciones compartidas por tus educadores. Toca una tarjeta para leer y escuchar.">Browse lessons shared by your educators. Tap a card to read and listen.</p>
</div>

<div class="filters">
  <span class="filter-label" data-en="Filter" data-es="Filtrar">Filter</span>
  <button class="filter-pill active" onclick="filterCards('All')" data-en="All" data-es="Todo">All</button>
  <button class="filter-pill" onclick="filterCards('Hygiene')" data-en="Hygiene" data-es="Higiene">Hygiene</button>
  <button class="filter-pill" onclick="filterCards('Equipment')" data-en="Equipment" data-es="Equipo">Equipment</button>
  <button class="filter-pill" onclick="filterCards('Technique')" data-en="Technique" data-es="Técnica">Technique</button>
  <button class="filter-pill" onclick="filterCards('Health')" data-en="Health" data-es="Salud">Health</button>
</div>

<div class="card-grid" id="cardGrid"></div>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div id="modalImageWrap"></div>
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle"></div>
        <button class="modal-close" onclick="closeModalDirect()" aria-label="Close">×</button>
      </div>
      <div class="modal-category-row">
        <span class="card-category" id="modalCategory"></span>
        <span class="card-date" id="modalDate"></span>
      </div>
      <div class="modal-annotation" id="modalAnnotation"></div>
      <div class="modal-audio" id="modalAudio">
        <button class="modal-audio-play" id="modalPlayBtn" onclick="toggleModalAudio()">
          <svg id="modalPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="modal-audio-info">
          <div class="modal-audio-label" data-en="Audio explanation" data-es="Explicación de audio" id="audioLabel">Audio explanation</div>
          <div class="modal-audio-bar"><div class="modal-audio-progress" id="audioProgress"></div></div>
        </div>
      </div>
      <div class="modal-footer-info">
        <span id="modalEducator"></span>
        <span id="modalCardCount"></span>
      </div>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  airtableApiKey: 'YOUR_AIRTABLE_API_KEY',
  airtableBaseId: 'YOUR_BASE_ID',
  airtableTableName: 'Lessons',
};

const SAMPLE_CARDS = [
  { id:1, title:'Teat cleaning before milking', titleEs:'Limpieza de pezones antes del ordeño', category:'Hygiene', annotation:'Always clean each teat with a single-use cloth before attaching the cluster. Work from the tip downward. This removes bacteria and stimulates milk let-down. Do not reuse cloths between cows.', annotationEs:'Siempre limpie cada pezón con un paño de un solo uso antes de conectar el grupo. Trabaje desde la punta hacia abajo. Esto elimina bacterias y estimula la bajada de leche. No reutilice los paños entre vacas.', educator:'T. Nkosi', date:'12 May 2026', hasAudio:true, imageUrl:null },
  { id:2, title:'Checking liner condition', titleEs:'Verificar condición de las pezoneras', category:'Equipment', annotation:'Liners must be replaced every 2500 milkings or 3 months — whichever comes first. A cracked or stretched liner reduces vacuum and increases mastitis risk. Hold the liner up to the light to check for cracks.', annotationEs:'Las pezoneras deben reemplazarse cada 2500 ordeños o 3 meses, lo que ocurra primero. Una pezonera agrietada reduce el vacío y aumenta el riesgo de mastitis.', educator:'A. Joubert', date:'10 May 2026', hasAudio:true, imageUrl:null },
  { id:3, title:'Forestripping — why it matters', titleEs:'Presellado — por qué importa', category:'Technique', annotation:'Strip 2–3 squirts from each quarter before attaching the cluster. This detects early mastitis signs (clots, watery milk) and stimulates oxytocin release. Check the strip cup carefully and record any abnormalities.', annotationEs:'Extraiga 2-3 chorros de cada cuarto antes de conectar el grupo. Esto detecta signos tempranos de mastitis y estimula la liberación de oxitocina.', educator:'T. Nkosi', date:'8 May 2026', hasAudio:false, imageUrl:null },
  { id:4, title:'Teat dipping after milking', titleEs:'Sellado de pezones después del ordeño', category:'Hygiene', annotation:'Dip all four teats immediately after cluster removal — within 30 seconds. Use a post-dip cup filled to the correct level. Cover the full length of the teat. This seals the teat canal while it is still open.', annotationEs:'Selle los cuatro pezones inmediatamente después de retirar el grupo, dentro de los 30 segundos. Use una copa de sellado llena al nivel correcto. Cubra toda la longitud del pezón.', educator:'A. Joubert', date:'5 May 2026', hasAudio:true, imageUrl:null },
  { id:5, title:'Identifying a swollen quarter', titleEs:'Identificar un cuarto inflamado', category:'Health', annotation:'Gently feel each quarter before milking. A hard, hot, or swollen quarter — especially with a reduced milk flow — is a mastitis indicator. Record the cow number and ear tag. Notify the herd manager immediately.', annotationEs:'Palpe suavemente cada cuarto antes del ordeño. Un cuarto duro, caliente o inflamado es un indicador de mastitis. Registre el número de vaca y notifique al encargado.', educator:'T. Nkosi', date:'3 May 2026', hasAudio:true, imageUrl:null },
  { id:6, title:'Vacuum level checks', titleEs:'Verificación del nivel de vacío', category:'Equipment', annotation:'Check the vacuum gauge at the start of every milking session. Correct vacuum is between 42–48 kPa. If the reading is outside this range, do not start milking — call the maintenance team. Record the reading in the log.', annotationEs:'Verifique el vacuómetro al inicio de cada sesión. El vacío correcto es entre 42-48 kPa. Si está fuera de rango, no comience el ordeño y llame al equipo de mantenimiento.', educator:'A. Joubert', date:'1 May 2026', hasAudio:false, imageUrl:null },
];

let currentLang = 'en';
let currentFilter = 'All';
let currentCard = null;
let audioTimer = null;
let audioPlaying = false;
let audioProgress = 0;

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn:${lang === 'en' ? 'first' : 'last'}-child`).classList.add('active');
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = lang === 'en' ? el.dataset.en : el.dataset.es;
  });
  renderCards();
}

function filterCards(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('cardGrid');
  const filtered = currentFilter === 'All' ? SAMPLE_CARDS : SAMPLE_CARDS.filter(c => c.category === currentFilter);
  
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM4 4h16v10H4V4zm0 16v-4h4v4H4zm6 0v-4h4v4h-4zm6 0v-4h4v4h-4z"/></svg><h3>${currentLang==='en'?'No cards found':'No se encontraron tarjetas'}</h3><p>${currentLang==='en'?'Try a different category filter.':'Prueba con un filtro de categoría diferente.'}</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map((card, i) => {
    const title = currentLang === 'en' ? card.title : card.titleEs;
    const annotation = currentLang === 'en' ? card.annotation : card.annotationEs;
    const catLabel = getCatLabel(card.category);
    const initials = card.educator.split(' ').map(w => w[0]).join('');
    return `
    <div class="card" style="animation-delay:${i*0.06}s" onclick="openModal(${card.id})">
      <div class="card-image-placeholder">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span class="card-category">${catLabel}</span>
          <span class="card-date">${card.date}</span>
        </div>
        <div class="card-title">${title}</div>
        <div class="card-annotation">${annotation}</div>
      </div>
      <div class="card-footer">
        <div class="educator-tag">
          <div class="educator-avatar">${initials}</div>
          ${card.educator}
        </div>
        ${card.hasAudio ? `<button class="audio-btn" onclick="event.stopPropagation();openModal(${card.id})">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          ${currentLang==='en'?'Listen':'Escuchar'}
        </button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function getCatLabel(cat) {
  const labels = { Hygiene: currentLang==='en'?'Hygiene':'Higiene', Equipment: currentLang==='en'?'Equipment':'Equipo', Technique: currentLang==='en'?'Technique':'Técnica', Health: currentLang==='en'?'Health':'Salud' };
  return labels[cat] || cat;
}

function openModal(id) {
  const card = SAMPLE_CARDS.find(c => c.id === id);
  if (!card) return;
  currentCard = card;
  stopAudio();

  const title = currentLang === 'en' ? card.title : card.titleEs;
  const annotation = currentLang === 'en' ? card.annotation : card.annotationEs;
  const initials = card.educator.split(' ').map(w => w[0]).join('');
  const idx = SAMPLE_CARDS.indexOf(card) + 1;

  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalCategory').textContent = getCatLabel(card.category);
  document.getElementById('modalDate').textContent = card.date;
  document.getElementById('modalAnnotation').textContent = annotation;
  document.getElementById('modalEducator').innerHTML = `<span style="display:flex;align-items:center;gap:6px"><span class="educator-avatar" style="width:22px;height:22px;border-radius:50%;background:#fdf0d5;color:#e9a84c;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center">${initials}</span>${card.educator}</span>`;
  document.getElementById('modalCardCount').textContent = `${currentLang==='en'?'Card':'Tarjeta'} ${idx} ${currentLang==='en'?'of':'de'} ${SAMPLE_CARDS.length}`;

  document.getElementById('modalImageWrap').innerHTML = `<div class="modal-image-placeholder"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>`;

  const audioSection = document.getElementById('modalAudio');
  audioSection.style.display = card.hasAudio ? 'flex' : 'none';
  document.getElementById('audioLabel').textContent = currentLang === 'en' ? 'Audio explanation' : 'Explicación de audio';

  document.getElementById('modalBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modalBackdrop')) closeModalDirect();
}

function closeModalDirect() {
  stopAudio();
  document.getElementById('modalBackdrop').classList.remove('open');
  document.body.style.overflow = '';
}

function toggleModalAudio() {
  if (audioPlaying) { stopAudio(); return; }
  audioPlaying = true;
  audioProgress = 0;
  document.getElementById('modalPlayBtn').classList.add('playing');
  document.getElementById('modalPlayIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  const duration = 30;
  const interval = 100;
  audioTimer = setInterval(() => {
    audioProgress += (interval / (duration * 1000)) * 100;
    document.getElementById('audioProgress').style.width = Math.min(audioProgress, 100) + '%';
    if (audioProgress >= 100) stopAudio();
  }, interval);
}

function stopAudio() {
  audioPlaying = false;
  clearInterval(audioTimer);
  audioProgress = 0;
  const btn = document.getElementById('modalPlayBtn');
  const icon = document.getElementById('modalPlayIcon');
  if (btn) { btn.classList.remove('playing'); }
  if (icon) { icon.innerHTML = '<path d="M8 5v14l11-7z"/>'; }
  const bar = document.getElementById('audioProgress');
  if (bar) bar.style.width = '0%';
}

renderCards();
</script>
</body>
</html>
