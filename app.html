<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Learning / Aprendizaje de Granja</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream:       #f5efe4;
  --cream-dark:  #ede4d3;
  --cream-deep:  #e0d4be;
  --straw:       #c8962a;
  --straw-light: #f5dfa0;
  --straw-pale:  #fdf4dc;
  --barn:        #8b2e1a;
  --barn-mid:    #a83828;
  --barn-pale:   #f5e8e5;
  --soil:        #3b2510;
  --soil-mid:    #5c3d20;
  --soil-light:  #8a6040;
  --milk:        #fdfaf4;
  --sky:         #a8bfd4;
  --sky-pale:    #e8f0f8;
  --text:        #2a1a0a;
  --text-mid:    #5c3d20;
  --text-muted:  #9a7a5a;
  --border:      rgba(139,46,26,0.12);
  --border-warm: rgba(139,46,26,0.25);
  --r:           18px;
  --card-h:      440px;
}

body {
  font-family: 'Lato', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  background-image:
    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c8962a' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

/* ── HEADER ── */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 2rem;
  background: var(--barn);
  position: sticky; top: 0; z-index: 100;
  border-bottom: 3px solid var(--straw);
}

.logo { display: flex; align-items: center; gap: 12px; }

.logo-mark {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--straw-light); border: 2px solid var(--straw);
  display: flex; align-items: center; justify-content: center;
}

.logo-mark svg { width: 20px; height: 20px; fill: var(--barn); }

.logo-text {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 700;
  color: var(--milk); line-height: 1.1;
}

.logo-text small {
  display: block; font-family: 'Lato', sans-serif;
  font-size: 0.65rem; font-weight: 400;
  color: var(--straw-light); letter-spacing: 0.1em; text-transform: uppercase;
}

.header-right { display: flex; align-items: center; gap: 14px; }

.counter-badge { font-size: 13px; color: var(--straw-light); }
.counter-badge span { color: #fff; font-weight: 700; }

.lang-toggle {
  display: flex;
  background: rgba(0,0,0,0.2);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px; overflow: hidden;
}

.lang-btn {
  padding: 5px 13px; font-size: 12px; font-weight: 700;
  font-family: 'Lato', sans-serif; letter-spacing: 0.05em;
  color: rgba(255,255,255,0.55); border: none; background: transparent;
  cursor: pointer; transition: all 0.2s;
}

.lang-btn.active { background: var(--straw); color: var(--soil); }

/* ── FILTERS ── */
.filters {
  display: flex; gap: 8px; padding: 1.25rem 2rem 0;
  flex-wrap: wrap; align-items: center;
  max-width: 900px; margin: 0 auto;
}

.filter-label {
  font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.1em; font-weight: 700; margin-right: 4px;
}

.filter-pill {
  padding: 5px 16px; border-radius: 20px; font-size: 12px; font-weight: 700;
  font-family: 'Lato', sans-serif; letter-spacing: 0.03em;
  border: 1.5px solid var(--cream-deep);
  background: var(--milk); color: var(--text-muted); cursor: pointer; transition: all 0.2s;
}

.filter-pill:hover { border-color: var(--barn-mid); color: var(--barn); }
.filter-pill.active { background: var(--barn); border-color: var(--barn); color: var(--milk); }

/* ── DECK STAGE ── */
.deck-stage {
  max-width: 900px; margin: 1.75rem auto; padding: 0 2rem 3rem;
}

.progress-bar {
  height: 3px; background: var(--cream-deep);
  border-radius: 2px; margin-bottom: 1.25rem; overflow: hidden;
}

.progress-fill {
  height: 100%; background: var(--straw);
  border-radius: 2px; transition: width 0.35s ease;
}

.hint {
  text-align: center; font-size: 12px; color: var(--text-muted);
  margin-bottom: 1.25rem; display: flex; align-items: center;
  justify-content: center; gap: 6px; letter-spacing: 0.03em;
}

/* ── FLIP CARD ── */
.flip-scene {
  width: 100%; height: var(--card-h);
  perspective: 1400px; cursor: pointer; margin-bottom: 1.5rem;
}

.flip-card {
  width: 100%; height: 100%;
  position: relative; transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
}

.flip-scene.flipped .flip-card { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: var(--r); overflow: hidden;
}

/* FRONT */
.card-front {
  background: var(--milk);
  border: 2px solid var(--cream-deep);
  display: flex; flex-direction: column;
  box-shadow: 0 4px 24px rgba(59,37,16,0.1), 0 1px 4px rgba(59,37,16,0.06);
}

.card-front-img {
  flex: 1; background: var(--cream-dark); position: relative; overflow: hidden;
}

.card-front-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

.no-img {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; color: var(--text-muted);
}

.no-img svg { width: 52px; height: 52px; opacity: 0.2; fill: var(--soil-mid); }
.no-img span { font-size: 13px; color: var(--text-muted); }

.flip-cue {
  position: absolute; bottom: 12px; right: 12px;
  background: rgba(253,244,220,0.92);
  border: 1px solid var(--straw);
  border-radius: 20px; padding: 5px 12px;
  font-size: 11px; color: var(--straw); font-weight: 700;
  display: flex; align-items: center; gap: 5px;
  letter-spacing: 0.04em; text-transform: uppercase;
  backdrop-filter: blur(4px);
}

.card-front-bar {
  padding: 1rem 1.25rem; background: var(--milk);
  display: flex; align-items: center; justify-content: space-between;
  border-top: 2px solid var(--cream-dark); flex-shrink: 0;
}

.card-front-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem; font-weight: 600; color: var(--text);
  line-height: 1.3; flex: 1; margin-right: 1rem;
}

.cat-pill {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 4px 12px; border-radius: 20px;
  background: var(--barn-pale); color: var(--barn);
  border: 1px solid rgba(139,46,26,0.2); white-space: nowrap; flex-shrink: 0;
}

/* BACK */
.card-back {
  background: var(--straw-pale);
  border: 2px solid var(--straw);
  transform: rotateY(180deg);
  display: flex; flex-direction: column;
  padding: 1.75rem; gap: 1.25rem;
  box-shadow: 0 4px 24px rgba(59,37,16,0.1), 0 1px 4px rgba(59,37,16,0.06);
}

.back-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 1rem;
}

.back-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 700;
  color: var(--soil); line-height: 1.3;
}

.back-divider {
  height: 2px; background: var(--straw-light);
  border-radius: 1px; flex-shrink: 0;
}

.back-annotation {
  font-size: 0.925rem; color: var(--soil-mid);
  line-height: 1.85; font-weight: 400; flex: 1; overflow-y: auto;
}

/* Audio */
.audio-player {
  background: var(--cream); border: 1.5px solid var(--cream-deep);
  border-radius: 14px; padding: 0.875rem 1rem;
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}

.play-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--barn); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.2s, transform 0.15s;
}

.play-btn:hover { background: var(--barn-mid); transform: scale(1.05); }
.play-btn:active { transform: scale(0.97); }
.play-btn svg { width: 15px; height: 15px; fill: var(--milk); margin-left: 2px; }
.play-btn.playing svg { margin-left: 0; }

.audio-info { flex: 1; min-width: 0; }

.audio-label {
  font-size: 10px; color: var(--text-muted); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
}

.audio-track { height: 3px; background: var(--cream-deep); border-radius: 2px; overflow: hidden; }
.audio-fill { height: 100%; background: var(--barn); border-radius: 2px; width: 0%; transition: width 0.1s linear; }
.audio-time { font-size: 11px; color: var(--text-muted); margin-top: 5px; font-variant-numeric: tabular-nums; }

.back-footer {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  padding-top: 0.25rem;
}

.edu-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--straw-light); color: var(--soil-mid);
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--straw); flex-shrink: 0;
}

.back-educator { font-size: 12px; color: var(--text-muted); flex: 1; }

.flip-back-cue {
  font-size: 11px; color: var(--text-muted); font-weight: 700;
  letter-spacing: 0.04em; text-transform: uppercase;
  display: flex; align-items: center; gap: 4px; cursor: pointer;
  transition: color 0.2s;
}

.flip-back-cue:hover { color: var(--barn); }

/* ── NAV ── */
.card-nav {
  display: flex; align-items: center; justify-content: center; gap: 16px;
}

.nav-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px solid var(--cream-deep);
  background: var(--milk); color: var(--text-muted);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  box-shadow: 0 1px 4px rgba(59,37,16,0.08);
}

.nav-btn:hover:not(:disabled) { border-color: var(--barn); color: var(--barn); background: var(--barn-pale); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-btn svg { width: 18px; height: 18px; }

.nav-dots { display: flex; gap: 6px; align-items: center; }

.nav-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--cream-deep); border: 1.5px solid var(--cream-deep);
  transition: all 0.2s; cursor: pointer;
}

.nav-dot.active { background: var(--barn); border-color: var(--barn); width: 22px; border-radius: 4px; }

/* ── STATE ── */
.state-msg {
  text-align: center; padding: 5rem 2rem; color: var(--text-muted);
}

.state-msg h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem; color: var(--soil-mid); margin-bottom: 0.5rem;
}

.state-msg p { font-size: 0.875rem; }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  header { padding: 0.875rem 1rem; }
  .filters, .deck-stage { padding-left: 1rem; padding-right: 1rem; }
  :root { --card-h: 400px; }
  .card-back { padding: 1.25rem; gap: 1rem; }
  .back-annotation { font-size: 0.875rem; }
  .logo-text small { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
    </div>
    <div class="logo-text">
      Farm Learning
      <small data-en="Milker Training Programme" data-es="Capacitación de Ordeñadores">Milker Training Programme</small>
    </div>
  </div>
  <div class="header-right">
    <span class="counter-badge" id="counterBadge"></span>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('es')">ES</button>
    </div>
  </div>
</header>

<div class="filters">
  <span class="filter-label" data-en="Topic" data-es="Tema">Topic</span>
  <button class="filter-pill active" onclick="filterCards('All',this)" data-en="All" data-es="Todo">All</button>
  <button class="filter-pill" onclick="filterCards('Hygiene',this)" data-en="Hygiene" data-es="Higiene">Hygiene</button>
  <button class="filter-pill" onclick="filterCards('Equipment',this)" data-en="Equipment" data-es="Equipo">Equipment</button>
  <button class="filter-pill" onclick="filterCards('Technique',this)" data-en="Technique" data-es="Técnica">Technique</button>
  <button class="filter-pill" onclick="filterCards('Health',this)" data-en="Health" data-es="Salud">Health</button>
</div>

<div class="deck-stage">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="hint">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
    <span id="hintText" data-en="Tap the card to flip it" data-es="Toca la tarjeta para voltearla">Tap the card to flip it</span>
  </div>

  <div class="flip-scene" id="flipScene" onclick="flipCard()">
    <div class="flip-card" id="flipCard">

      <!-- FRONT -->
      <div class="card-face card-front">
        <div class="card-front-img" id="frontImg">
          <div class="no-img">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg>
            <span id="noImgText">No image yet</span>
          </div>
        </div>
        <div class="flip-cue">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
          <span data-en="Tap to flip" data-es="Voltear">Tap to flip</span>
        </div>
        <div class="card-front-bar">
          <div class="card-front-title" id="frontTitle">Loading...</div>
          <span class="cat-pill" id="frontCat"></span>
        </div>
      </div>

      <!-- BACK -->
      <div class="card-face card-back">
        <div class="back-top">
          <div class="back-title" id="backTitle"></div>
          <span class="cat-pill" id="backCat"></span>
        </div>
        <div class="back-divider"></div>
        <div class="back-annotation" id="backAnnotation"></div>
        <div class="audio-player" id="audioPlayer">
          <button class="play-btn" id="playBtn" onclick="event.stopPropagation();toggleAudio()">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="audio-info">
            <div class="audio-label" id="audioLabel">Audio explanation</div>
            <div class="audio-track"><div class="audio-fill" id="audioFill"></div></div>
            <div class="audio-time" id="audioTime">0:00</div>
          </div>
        </div>
        <div class="back-footer">
          <div class="edu-avatar" id="backAvatar"></div>
          <span class="back-educator" id="backEducator"></span>
          <span class="flip-back-cue" onclick="event.stopPropagation();unflip()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
            <span data-en="Flip back" data-es="Voltear">Flip back</span>
          </span>
        </div>
      </div>

    </div>
  </div>

  <div class="card-nav" id="cardNav">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="nav-dots" id="navDots"></div>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <div id="stateMsg" class="state-msg" style="display:none"></div>
</div>

<script>
let allCards=[], filtered=[], current=0, lang='en';
let isFlipped=false, audioEl=null, audioPlaying=false;

const CAT={
  en:{Hygiene:'Hygiene',Equipment:'Equipment',Technique:'Technique',Health:'Health',General:'General'},
  es:{Hygiene:'Higiene',Equipment:'Equipo',Technique:'Técnica',Health:'Salud',General:'General'}
};

async function fetchCards(){
  showState('<h3>Loading cards...</h3>');
  try{
    const res=await fetch('https://api.airtable.com/v0/apppxuXZog3mlbrli/tbltz4VhRS6bnYPOz',{
      headers:{Authorization:'Bearer patECg2gZL4t7qA9s.4e6c05ef2848c4d9797d6c94faf64dc98b43de6b43995fbbc8ac6038616e7468'}
    });
    if(!res.ok) throw new Error('Airtable error '+res.status);
    const data=await res.json();
    allCards=(data.records||[]).map(rec=>{
      const f=rec.fields||{};
      const imgs=f['Image']||[], auds=f['Audio']||[];
      return{
        id:rec.id,
        title:f['Lesson title']||'Untitled',
        category:f['Category']||'General',
        annotation:f['Annotation']||'',
        educator:f['Educator']||'',
        imageUrl:imgs.length?imgs[0].url:null,
        audioUrl:auds.length?auds[0].url:null,
        hasAudio:auds.length>0,
      };
    });
    filtered=[...allCards];
    current=0;
    hideState();
    renderCard();
    renderDots();
  }catch(e){
    showState(`<h3>Could not load cards</h3><p>${e.message}</p>`);
  }
}

function showState(html){
  document.getElementById('stateMsg').innerHTML=html;
  document.getElementById('stateMsg').style.display='block';
  document.getElementById('flipScene').style.display='none';
  document.getElementById('cardNav').style.display='none';
}

function hideState(){
  document.getElementById('stateMsg').style.display='none';
  document.getElementById('flipScene').style.display='block';
  document.getElementById('cardNav').style.display='flex';
}

function renderCard(){
  if(!filtered.length){
    showState(`<h3>${lang==='en'?'No cards found':'Sin tarjetas'}</h3><p>${lang==='en'?'Try a different filter.':'Prueba otro filtro.'}</p>`);
    return;
  }
  hideState(); stopAudio(); unflip();
  const card=filtered[current];
  const catLabel=CAT[lang][card.category]||card.category;
  const initials=card.educator.split(' ').filter(Boolean).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?';

  const fi=document.getElementById('frontImg');
  fi.innerHTML=card.imageUrl
    ?`<img src="${card.imageUrl}" alt="${card.title}" style="width:100%;height:100%;object-fit:cover;display:block">`
    :`<div class="no-img"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg><span>${lang==='en'?'No image yet':'Sin imagen'}</span></div>`;

  document.getElementById('frontTitle').textContent=card.title;
  document.getElementById('frontCat').textContent=catLabel;
  document.getElementById('backTitle').textContent=card.title;
  document.getElementById('backCat').textContent=catLabel;
  document.getElementById('backAnnotation').textContent=card.annotation||(lang==='en'?'No annotation added yet.':'Sin anotación todavía.');
  document.getElementById('backAvatar').textContent=initials;
  document.getElementById('backEducator').textContent=card.educator||'—';
  document.getElementById('audioLabel').textContent=lang==='en'?'Audio explanation':'Explicación de audio';
  document.getElementById('audioPlayer').style.display=card.hasAudio?'flex':'none';

  audioEl=card.audioUrl?new Audio(card.audioUrl):null;
  if(audioEl){
    audioEl.ontimeupdate=()=>{
      const pct=audioEl.duration?(audioEl.currentTime/audioEl.duration)*100:0;
      document.getElementById('audioFill').style.width=pct+'%';
      document.getElementById('audioTime').textContent=fmt(audioEl.currentTime);
    };
    audioEl.onended=stopAudio;
  }

  const pct=filtered.length>1?(current/(filtered.length-1))*100:100;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===filtered.length-1;
  updateCounter(); updateDots();
}

function flipCard(){
  isFlipped=!isFlipped;
  document.getElementById('flipScene').classList.toggle('flipped',isFlipped);
  document.getElementById('hintText').textContent=isFlipped
    ?(lang==='en'?'Tap to flip back':'Toca para voltear')
    :(lang==='en'?'Tap the card to flip it':'Toca la tarjeta para voltearla');
}

function unflip(){
  isFlipped=false;
  document.getElementById('flipScene').classList.remove('flipped');
  document.getElementById('hintText').textContent=lang==='en'?'Tap the card to flip it':'Toca la tarjeta para voltearla';
}

function navigate(dir){
  const n=current+dir;
  if(n<0||n>=filtered.length) return;
  current=n; renderCard();
}

function renderDots(){
  const max=Math.min(filtered.length,7);
  document.getElementById('navDots').innerHTML=Array.from({length:max},(_,i)=>
    `<div class="nav-dot" onclick="jumpTo(${i})"></div>`
  ).join('');
  updateDots();
}

function updateDots(){
  const dots=document.querySelectorAll('.nav-dot');
  const max=dots.length; if(!max) return;
  const idx=max>1?Math.round((current/Math.max(filtered.length-1,1))*(max-1)):0;
  dots.forEach((d,i)=>d.classList.toggle('active',i===idx));
}

function jumpTo(dotIdx){
  const max=Math.min(filtered.length,7);
  current=max>1?Math.round((dotIdx/(max-1))*(filtered.length-1)):0;
  renderCard();
}

function updateCounter(){
  const el=document.getElementById('counterBadge');
  el.innerHTML=filtered.length?`<span>${current+1}</span> / ${filtered.length}`:'';
}

function filterCards(cat,btn){
  document.querySelectorAll('.filter-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  filtered=cat==='All'?[...allCards]:allCards.filter(c=>c.category===cat);
  current=0; renderCard(); renderDots();
}

function toggleAudio(){
  if(!audioEl) return;
  if(audioPlaying){stopAudio();return;}
  audioPlaying=true;
  document.getElementById('playBtn').classList.add('playing');
  document.getElementById('playIcon').innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  audioEl.play().catch(stopAudio);
}

function stopAudio(){
  audioPlaying=false;
  if(audioEl){audioEl.pause();audioEl.currentTime=0;}
  const btn=document.getElementById('playBtn');
  const icon=document.getElementById('playIcon');
  if(btn) btn.classList.remove('playing');
  if(icon) icon.innerHTML='<path d="M8 5v14l11-7z"/>';
  const fill=document.getElementById('audioFill');
  const time=document.getElementById('audioTime');
  if(fill) fill.style.width='0%';
  if(time) time.textContent='0:00';
}

function fmt(s){return Math.floor(s/60)+':'+Math.floor(s%60).toString().padStart(2,'0');}

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.lang-btn:${l==='en'?'first':'last'}-child`).classList.add('active');
  document.querySelectorAll('[data-en]').forEach(el=>{
    el.textContent=l==='en'?el.dataset.en:el.dataset.es;
  });
  if(filtered.length) renderCard();
}

fetchCards();
</script>
</body>
</html>
