<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dairy Dictionary</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: #ffffff;
  color: #1a2635;
  min-height: 100vh;
  padding: 20px 24px 24px;
}

/* ── TOP BAR ── */
.topbar {
  display: flex; align-items: baseline;
  justify-content: space-between;
  margin-bottom: 18px;
}

.app-title {
  font-size: 1.6rem; font-weight: 700;
  color: #0070C0; letter-spacing: -0.01em;
}

.menu-label {
  font-size: 1.1rem; font-weight: 600;
  color: #0070C0;
}

/* ── MAIN LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 1fr 260px;
  gap: 20px;
  align-items: start;
}

/* ── CARD AREA ── */
.card-area { display: flex; flex-direction: column; gap: 14px; }

/* FLIP SCENE */
.flip-scene {
  width: 100%;
  height: 580px;
  perspective: 1400px;
  cursor: pointer;
  border-radius: 14px;
  overflow: hidden;
}

.flip-card {
  width: 100%; height: 100%;
  position: relative; transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.4,0.2,0.2,1);
}

.flip-scene.flipped .flip-card { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 14px; overflow: hidden;
}

/* FRONT */
.card-front {
  background: #eee;
  display: flex; flex-direction: column;
  box-shadow: 0 4px 24px rgba(0,0,0,0.12);
}

.front-media {
  flex: 1; position: relative; overflow: hidden;
  background: #222;
}

.front-media img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}

.no-media {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px; color: #999;
}

.no-media svg { width: 48px; height: 48px; opacity: 0.2; fill: #666; }

/* Flip Card label centered on image */
.flip-card-label {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: white; font-size: 1.1rem; font-weight: 600;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  pointer-events: none;
}

.tap-to-flip {
  position: absolute; bottom: 14px; right: 14px;
  background: #0070C0; color: white;
  border: none; border-radius: 8px;
  padding: 9px 18px; font-size: 13px; font-weight: 700;
  font-family: 'Inter', sans-serif; letter-spacing: 0.04em;
  cursor: pointer; transition: background 0.2s;
  box-shadow: 0 2px 8px rgba(0,112,192,0.4);
}

.tap-to-flip:hover { background: #005a99; }

/* Video on front */
.video-thumb-wrap { width: 100%; height: 100%; position: relative; }
.video-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.play-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.25);
}
.play-circle {
  width: 60px; height: 60px; border-radius: 50%;
  background: white; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.play-circle svg { width: 24px; height: 24px; fill: #0070C0; margin-left: 3px; }
.new-badge {
  position: absolute; top: 12px; left: 12px;
  background: #f0a500; color: white;
  font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
}
.video-badge {
  position: absolute; top: 12px; right: 12px;
  background: rgba(0,112,192,0.85); color: white;
  font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
}

/* BACK */
.card-back {
  background: white;
  border: 2px solid #cce4f5;
  transform: rotateY(180deg);
  display: flex; flex-direction: column;
  box-shadow: 0 4px 24px rgba(0,0,0,0.12);
}

.back-topbar {
  background: #0070C0; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}

.back-cat-name {
  font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.9);
  letter-spacing: 0.06em; text-transform: uppercase;
}

.card-lang-toggle {
  display: flex; background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 8px; overflow: hidden;
}

.card-lang-btn {
  padding: 4px 13px; font-size: 11px; font-weight: 700;
  font-family: 'Inter', sans-serif; letter-spacing: 0.05em;
  color: rgba(255,255,255,0.65); border: none; background: transparent;
  cursor: pointer; transition: all 0.18s; text-transform: uppercase;
}

.card-lang-btn.active { background: white; color: #0070C0; border-radius: 6px; }

.back-body {
  flex: 1; display: flex; flex-direction: column;
  padding: 1.1rem; gap: 0.875rem; overflow: hidden;
}

.back-video-wrap {
  border-radius: 10px; overflow: hidden;
  background: #000; flex-shrink: 0;
  max-height: 170px; display: none;
}

.back-video-wrap video { width: 100%; max-height: 170px; display: block; object-fit: cover; }

.back-annotation {
  flex: 1; overflow-y: auto;
  font-size: 0.925rem; line-height: 1.8;
  color: #3a5068; font-weight: 400;
  transition: opacity 0.18s ease;
}

.back-annotation.switching { opacity: 0; }

.audio-player {
  display: flex; align-items: center; gap: 10px;
  background: #e6f2fa; border: 1px solid #cce4f5;
  border-radius: 10px; padding: 9px 12px; flex-shrink: 0;
}

.play-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: #0070C0; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.2s, transform 0.15s;
}

.play-btn:hover { background: #005a99; transform: scale(1.05); }
.play-btn svg { width: 13px; height: 13px; fill: white; margin-left: 2px; }
.play-btn.playing svg { margin-left: 0; }

.audio-info { flex: 1; min-width: 0; }
.audio-label { font-size: 10px; color: #0070C0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 5px; }
.audio-track { height: 3px; background: #cce4f5; border-radius: 2px; overflow: hidden; }
.audio-fill { height: 100%; background: #0070C0; border-radius: 2px; width: 0%; transition: width 0.1s linear; }
.audio-time { font-size: 11px; color: #8a9faf; margin-top: 4px; font-variant-numeric: tabular-nums; }

.back-footer {
  padding: 8px 1.1rem;
  display: flex; align-items: center; gap: 8px;
  border-top: 1px solid #e8ecf0; flex-shrink: 0;
  background: #f5f7fa;
}

.edu-avatar {
  width: 22px; height: 22px; border-radius: 50%;
  background: #e6f2fa; color: #0070C0;
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid #cce4f5; flex-shrink: 0;
}

.back-educator { font-size: 11px; color: #8a9faf; flex: 1; font-weight: 500; }

.flip-back-btn {
  font-size: 10px; color: #0070C0; font-weight: 700;
  letter-spacing: 0.05em; text-transform: uppercase;
  display: flex; align-items: center; gap: 4px;
  cursor: pointer; border: none; background: none;
  font-family: 'Inter', sans-serif;
}

.flip-back-btn svg { width: 10px; height: 10px; fill: currentColor; }

/* ── NAV ── */
.card-nav {
  display: flex; align-items: center; justify-content: center; gap: 12px;
}

.nav-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid #ccc; background: white; color: #666;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-size: 16px; font-weight: 700;
  font-family: 'Inter', sans-serif;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

.nav-btn:hover:not(:disabled) { border-color: #0070C0; color: #0070C0; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }

.counter-text {
  font-size: 13px; color: #999; font-weight: 500; min-width: 50px; text-align: center;
}

/* ── ICON GRID ── */
.icon-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.icon-btn {
  width: 100%; aspect-ratio: 1;
  border: none; background: none; padding: 0;
  cursor: pointer; border-radius: 12px;
  transition: transform 0.15s, filter 0.15s;
  overflow: hidden;
}

.icon-btn img {
  width: 100%; height: 100%;
  object-fit: contain; display: block;
  border-radius: 10px;
}

.icon-btn:hover { transform: scale(1.05); filter: brightness(1.05); }

.icon-btn.active {
  outline: 3px solid #0070C0;
  outline-offset: 2px;
  border-radius: 12px;
}

.icon-btn.active[data-cat="New"] { outline-color: #2bc5b4; }
.icon-btn.active[data-cat="Share"] { outline-color: #e8765a; }
.icon-btn.active[data-cat="Milking"] { outline-color: #0070C0; }
.icon-btn.active[data-cat="Calves"] { outline-color: #f0a500; }
.icon-btn.active[data-cat="Health"] { outline-color: #cc2222; }
.icon-btn.active[data-cat="Safety"] { outline-color: #e06010; }
.icon-btn.active[data-cat="Breeding"] { outline-color: #5533aa; }
.icon-btn.active[data-cat="Feeding"] { outline-color: #1a7a1a; }

/* State */
.state-msg {
  text-align: center; padding: 4rem 2rem; color: #8a9faf;
}

.state-msg h3 {
  font-size: 1.1rem; color: #4a6070; margin-bottom: 0.5rem; font-weight: 600;
}

/* ── MOBILE ── */
@media (max-width: 640px) {
  body { padding: 14px 14px 24px; }
  .layout { grid-template-columns: 1fr; }
  .icon-grid { grid-template-columns: repeat(4, 1fr); }
  .topbar { margin-bottom: 12px; }
  .flip-scene { height: 480px; }
  .app-title { font-size: 1.2rem; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <span class="app-title">Dairy Dictionary</span>
  <span class="menu-label">Menu Bar</span>
</div>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- LEFT: CARD + NAV -->
  <div class="card-area">

    <!-- FLIP CARD -->
    <div class="flip-scene" id="flipScene" onclick="flipCard()">
      <div class="flip-card" id="flipCard">

        <!-- FRONT -->
        <div class="card-face card-front">
          <div class="front-media" id="frontMedia">
            <div class="no-media">
              <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg>
            </div>
          </div>
          <div class="flip-card-label" id="flipCardLabel">Flip Card</div>
          <button class="tap-to-flip" onclick="event.stopPropagation();flipCard()">TAP TO FLIP</button>
        </div>

        <!-- BACK -->
        <div class="card-face card-back">
          <div class="back-topbar">
            <div class="back-cat-name" id="backCatLabel">—</div>
            <div class="card-lang-toggle" onclick="event.stopPropagation()">
              <button class="card-lang-btn active" id="btnEN" onclick="setCardLang('en')">EN</button>
              <button class="card-lang-btn" id="btnES" onclick="setCardLang('es')">ES</button>
            </div>
          </div>
          <div class="back-body">
            <div class="back-video-wrap" id="backVideoWrap"></div>
            <div class="back-annotation" id="backAnnotation"></div>
            <div class="audio-player" id="audioPlayer" style="display:none">
              <button class="play-btn" id="playBtn" onclick="event.stopPropagation();toggleAudio()">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <div class="audio-info">
                <div class="audio-label" id="audioLabel">Audio explanation</div>
                <div class="audio-track"><div class="audio-fill" id="audioFill"></div></div>
                <div class="audio-time" id="audioTime">0:00</div>
              </div>
            </div>
          </div>
          <div class="back-footer">
            <div class="edu-avatar" id="backAvatar"></div>
            <span class="back-educator" id="backEducator"></span>
            <button class="flip-back-btn" onclick="event.stopPropagation();unflip()">
              <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
              Flip back
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- NAV -->
    <div class="card-nav" id="cardNav">
      <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>&#x276E;</button>
      <span class="counter-text" id="counterText"></span>
      <button class="nav-btn" id="nextBtn" onclick="navigate(1)">&#x276F;</button>
    </div>

    <div id="stateMsg" class="state-msg" style="display:none"></div>
  </div>

  <!-- RIGHT: ICON GRID -->
  <div class="icon-grid">
    <button class="icon-btn active" data-cat="New" onclick="filterCards('New',this)">

<script>
const NEW_DAYS = 7;
let allCards = [], filtered = [], current = 0, cardLang = 'en';
let isFlipped = false, audioEl = null, audioPlaying = false;
let activeFilter = 'New';

const getText = v => {
  if (!v) return '';
  if (typeof v === 'string') return v;
  if (Array.isArray(v)) return v.map(i => i.text || i.value || String(i)).join(' ');
  if (typeof v === 'object') return v.text || v.value || Object.values(v).join(' ');
  return String(v);
};

const isNew = d => d && (Date.now() - new Date(d)) / 86400000 <= NEW_DAYS;
const normCat = r => { if (!r) return 'General'; const s = r.trim(); return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); };
const fmt = s => Math.floor(s/60) + ':' + Math.floor(s%60).toString().padStart(2,'0');

async function fetchCards() {
  showState('<h3>Loading…</h3>');
  try {
    const res = await fetch('https://api.airtable.com/v0/apppxuXZog3mlbrli/tbltz4VhRS6bnYPOz', {
      headers: { Authorization: 'Bearer patECg2gZL4t7qA9s.4e6c05ef2848c4d9797d6c94faf64dc98b43de6b43995fbbc8ac6038616e7468' }
    });
    if (!res.ok) throw new Error('Airtable error ' + res.status);
    const data = await res.json();
    allCards = (data.records || []).map(rec => {
      const f = rec.fields || {};
      return {
        id: rec.id,
        category: normCat(f['Category']),
        annotationEN: getText(f['Annotation']),
        annotationES: getText(f['Annotation (Spanish)']),
        educator: f['Educator'] || '',
        dateSubmitted: f['Date Submitted'] || f['Created'] || null,
        imageUrl: (f['Image'] || []).length ? f['Image'][0].url : null,
        videoUrl: (f['Video'] || []).length ? f['Video'][0].url : null,
        videoThumb: f['Video Thumbnail'] || null,
        audioUrlEN: (f['Audio'] || []).length ? f['Audio'][0].url : null,
        audioUrlES: (f['Audio (Spanish)'] || []).length ? f['Audio (Spanish)'][0].url : null,
      };
    });
    filtered = applyFilter(allCards);
    current = 0;
    hideState(); renderCard();
  } catch(e) {
    showState(`<h3>Could not load cards</h3><p>${e.message}</p>`);
  }
}

function applyFilter(cards) {
  if (activeFilter === 'New') return cards.filter(c => isNew(c.dateSubmitted));
  if (activeFilter === 'Share') return [];
  if (activeFilter === 'All') return [...cards];
  return cards.filter(c => c.category.toLowerCase() === activeFilter.toLowerCase());
}

function filterCards(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtered = applyFilter(allCards);
  current = 0; renderCard();
}

function renderCard() {
  if (!filtered.length) {
    const msg = activeFilter === 'New'
      ? '<h3>No new cards</h3><p>Nothing added in the last 7 days.</p>'
      : activeFilter === 'Share'
      ? '<h3>Coming soon</h3><p>The Share feature is not yet available.</p>'
      : '<h3>No cards found</h3><p>Try a different category.</p>';
    showState(msg); return;
  }
  hideState(); stopAudio(); stopVideo(); unflip();
  const card = filtered[current];
  const initials = card.educator.split(' ').filter(Boolean).map(w=>w[0]).join('').toUpperCase().slice(0,2) || '?';

  // Front media
  const fm = document.getElementById('frontMedia');
  if (card.videoUrl) {
    fm.innerHTML = `<div class="video-thumb-wrap">
      ${card.videoThumb ? `<img src="${card.videoThumb}" alt="Video">` : ''}
      <div class="play-overlay"><div class="play-circle">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div></div>
    </div><div class="video-badge">VIDEO</div>`;
  } else if (card.imageUrl) {
    fm.innerHTML = `<img src="${card.imageUrl}" alt="Training">`;
  } else {
    fm.innerHTML = `<div class="no-media"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg></div>`;
  }

  if (isNew(card.dateSubmitted)) {
    const b = document.createElement('div');
    b.className = 'new-badge'; b.textContent = 'New';
    fm.appendChild(b);
  }

  document.getElementById('flipCardLabel').textContent = 'Flip Card';
  document.getElementById('backCatLabel').textContent = card.category;
  document.getElementById('backAvatar').textContent = initials;
  document.getElementById('backEducator').textContent = card.educator || '—';

  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === filtered.length - 1;
  document.getElementById('counterText').textContent = `${current+1} / ${filtered.length}`;

  renderCardContent(card);
}

function renderCardContent(card) {
  card = card || filtered[current];
  const isES = cardLang === 'es';
  const annotation = isES ? (card.annotationES || '') : (card.annotationEN || '');
  const audioUrl = isES ? card.audioUrlES : card.audioUrlEN;

  const el = document.getElementById('backAnnotation');
  if (!annotation && isES) {
    el.textContent = 'Spanish translation not yet available.';
    el.style.fontStyle = 'italic'; el.style.color = '#8a9faf';
  } else {
    el.textContent = annotation || 'No annotation yet.';
    el.style.fontStyle = ''; el.style.color = '';
  }

  const vw = document.getElementById('backVideoWrap');
  if (card.videoUrl) {
    vw.style.display = 'block';
    const old = vw.querySelector('video');
    if (old) old.pause();
    vw.innerHTML = `<video controls playsinline preload="metadata"><source src="${card.videoUrl}"></video>`;
  } else {
    vw.style.display = 'none'; vw.innerHTML = '';
  }

  document.getElementById('audioPlayer').style.display = audioUrl ? 'flex' : 'none';
  document.getElementById('audioLabel').textContent = isES ? 'Explicación de audio' : 'Audio explanation';

  stopAudio();
  audioEl = audioUrl ? new Audio(audioUrl) : null;
  if (audioEl) {
    audioEl.ontimeupdate = () => {
      const p = audioEl.duration ? (audioEl.currentTime/audioEl.duration)*100 : 0;
      document.getElementById('audioFill').style.width = p + '%';
      document.getElementById('audioTime').textContent = fmt(audioEl.currentTime);
    };
    audioEl.onended = stopAudio;
  }
}

function setCardLang(l) {
  cardLang = l;
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  document.getElementById('btnES').classList.toggle('active', l==='es');
  const el = document.getElementById('backAnnotation');
  el.classList.add('switching');
  setTimeout(() => { renderCardContent(); el.classList.remove('switching'); }, 180);
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('flipScene').classList.toggle('flipped', isFlipped);
}

function unflip() {
  isFlipped = false;
  document.getElementById('flipScene').classList.remove('flipped');
}

function navigate(dir) {
  const n = current + dir;
  if (n < 0 || n >= filtered.length) return;
  current = n; renderCard();
}

function toggleAudio() {
  if (!audioEl) return;
  if (audioPlaying) { stopAudio(); return; }
  audioPlaying = true;
  document.getElementById('playBtn').classList.add('playing');
  document.getElementById('playIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  audioEl.play().catch(stopAudio);
}

function stopAudio() {
  audioPlaying = false;
  if (audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
  const btn = document.getElementById('playBtn');
  const icon = document.getElementById('playIcon');
  if (btn) btn.classList.remove('playing');
  if (icon) icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  const fill = document.getElementById('audioFill');
  const time = document.getElementById('audioTime');
  if (fill) fill.style.width = '0%';
  if (time) time.textContent = '0:00';
}

function stopVideo() {
  const vw = document.getElementById('backVideoWrap');
  if (!vw) return;
  const vid = vw.querySelector('video');
  if (vid) { vid.pause(); vid.currentTime = 0; }
}

function showState(html) {
  document.getElementById('stateMsg').innerHTML = html;
  document.getElementById('stateMsg').style.display = 'block';
  document.getElementById('flipScene').style.display = 'none';
  document.getElementById('cardNav').style.display = 'none';
}

function hideState() {
  document.getElementById('stateMsg').style.display = 'none';
  document.getElementById('flipScene').style.display = 'block';
  document.getElementById('cardNav').style.display = 'flex';
}

fetchCards();
</script>
